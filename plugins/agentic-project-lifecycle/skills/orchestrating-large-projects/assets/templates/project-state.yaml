schema_version: "2.0"
project:
  id: "{{PROJECT_ID}}"
  name: "{{PROJECT_NAME}}"
  type: software
  mode: greenfield
  owner: "{{OWNER}}"

lifecycle:
  current_phase: orientation
  status: in-progress
  gate_id: GATE-ORIENTATION
  source_commit: uncommitted
  last_updated: "{{DATE}}"

current_outcome:
  id: OUTCOME-ORIENTATION
  statement: "Establish the project charter and highest-risk assumptions"
  metric: "Orientation artifacts reviewed"
  target: "Charter, product boundary, and roadmap ready for discovery"
  owner: "{{OWNER}}"

blockers: []
residual_risks: []

artifacts:
  charter:
    status: draft
    path: docs/00-governance/PROJECT_CHARTER.md
    owner: "{{OWNER}}"
    source_commit: uncommitted
    approval:
      status: pending
  prd:
    status: draft
    path: docs/02-product/PRD.md
    owner: "{{OWNER}}"
    source_commit: uncommitted
    approval:
      status: pending
  roadmap:
    status: draft
    path: docs/05-planning/ROADMAP.md
    owner: "{{OWNER}}"
    source_commit: uncommitted
    approval:
      status: pending

contracts:
  active_task: null
  active_transition: null
