name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Validate evaluation and promotion gates
        run: python validate.py
      - name: Run regression tests
        run: python -m pytest -q
      - name: Validate publication contract
        run: python scripts/validate_publication.py
      - name: Build deterministic release assets
        if: matrix.python-version == '3.12'
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: python scripts/build_release.py --version 1.0.0-rc.1 --output dist
      - name: Upload release-candidate evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-project-lifecycle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
