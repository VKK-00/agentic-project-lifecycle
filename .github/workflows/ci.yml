name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development and audit dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pip-audit==2.10.1
      - name: Snapshot external Python dependencies
        run: python -m pip freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
      - name: Audit Python dependencies
        run: python -m pip_audit --strict --no-deps --requirement "$RUNNER_TEMP/audit-requirements.txt" --progress-spinner off
      - name: Validate evaluation and promotion gates
        run: python validate.py
      - name: Run regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: set -o pipefail; python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"
      - name: Upload regression failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-failure-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: error
          retention-days: 3
      - name: Validate publication contract
        run: python scripts/validate_publication.py
      - name: Build deterministic release assets
        if: matrix.python-version == '3.12'
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: python scripts/build_release.py --version 1.1.0-rc.1 --output dist
      - name: Upload release-candidate evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-project-lifecycle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
