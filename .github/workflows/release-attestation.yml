name: Release attestations

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path("plugins/agentic-project-lifecycle/.codex-plugin/plugin.json")
          print(json.loads(manifest.read_text(encoding="utf-8"))["version"])
          PY
          )"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build deterministic release bundle
        env:
          SOURCE_DATE_EPOCH: "315532800"
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/build_release.py --version "${RELEASE_VERSION}" --output dist
      - name: Attest release checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/agentic-project-lifecycle-${{ steps.version.outputs.version }}.zip
          sbom-path: dist/agentic-project-lifecycle-${{ steps.version.outputs.version }}.spdx.json
